name: News autopilot

# Manual "run now" button only. The 30-minute schedule lives in the
# Cloudflare Worker in cron-worker/ — GitHub switches off scheduled
# workflows in public repos after 60 days without activity, which would
# silently stop a deploy-and-leave site.
#
# Needs repo secret CRON_SECRET (same value as the Cloudflare secret).
# The JSON content type matters: Astro's origin check rejects bodiless or
# form-encoded cross-site POSTs with a 403.

on:
  workflow_dispatch: {}

concurrency:
  group: news-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://mymanipur.com' }}
        run: |
          status=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST "$SITE_URL/api/cron/news-sync" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}')
          cat response.json
          echo
          echo "HTTP $status"
          test "$status" = "200"
